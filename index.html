<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>全螢幕網頁相機</title>
    <style>
        /* 重置基本樣式，隱藏滾動條 */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* 初始啟動畫面遮罩 */
        #start-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            cursor: pointer;
            z-index: 100;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        /* 相機預覽影片 */
        #camera-preview {
            width: 100%;
            height: 100%;
            object-fit: cover; /* 確保影片填滿螢幕且不變形 */
            display: none;
        }

        /* 操作面板 */
        #controls {
            position: absolute;
            bottom: 30px;
            left: 0;
            width: 100%;
            display: none; /* 初始隱藏，相機啟動後顯示 */
            justify-content: center;
            align-items: center;
            gap: 20px;
            z-index: 10;
        }

        /* 按鈕樣式 */
        button {
            background-color: rgba(255, 255, 255, 0.2);
            border: 2px solid white;
            color: white;
            padding: 15px 25px;
            border-radius: 30px;
            font-size: 16px;
            cursor: pointer;
            backdrop-filter: blur(5px);
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: rgba(255, 255, 255, 0.5);
        }

        /* 拍照按鈕特別樣式 */
        #capture-btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background-color: white;
            border: 4px solid #ddd;
            padding: 0;
        }

        #capture-btn:active {
            background-color: #ccc;
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div id="start-overlay">
        點擊畫面任意處<br>進入全螢幕並開啟相機
    </div>

    <video id="camera-preview" autoplay playsinline></video>

    <div id="controls">
        <button id="switch-btn">切換鏡頭</button>
        <button id="capture-btn"></button>
        <button id="exit-btn">離開全螢幕</button>
    </div>

    <script>
        const startOverlay = document.getElementById('start-overlay');
        const cameraPreview = document.getElementById('camera-preview');
        const controls = document.getElementById('controls');
        const captureBtn = document.getElementById('capture-btn');
        const switchBtn = document.getElementById('switch-btn');
        const exitBtn = document.getElementById('exit-btn');

        let videoStream = null;
        let currentFacingMode = 'environment'; // 預設使用後置鏡頭 (environment)，前置為 'user'

        // 1. 點擊畫面任意處進入全螢幕並啟動相機
        startOverlay.addEventListener('click', async () => {
            try {
                // 請求全螢幕
                if (!document.fullscreenElement) {
                    await document.documentElement.requestFullscreen();
                }
                
                // 隱藏遮罩，顯示相機與控制列
                startOverlay.style.display = 'none';
                cameraPreview.style.display = 'block';
                controls.style.display = 'flex';

                // 啟動相機
                startCamera();
            } catch (err) {
                alert(`無法進入全螢幕或開啟相機: ${err.message}`);
            }
        });

        // 2. 啟動相機功能
        async function startCamera() {
            // 如果已有影像流，先停止它（用於切換鏡頭時）
            if (videoStream) {
                videoStream.getTracks().forEach(track => track.stop());
            }

            const constraints = {
                video: {
                    facingMode: currentFacingMode,
                    width: { ideal: 1920 },
                    height: { ideal: 1080 }
                },
                audio: false // 相機通常不需要聲音
            };

            try {
                videoStream = await navigator.mediaDevices.getUserMedia(constraints);
                cameraPreview.srcObject = videoStream;
            } catch (err) {
                console.error("相機存取失敗:", err);
                alert("無法存取相機，請確認您已給予瀏覽器相機權限。");
            }
        }

        // 3. 拍照功能
        captureBtn.addEventListener('click', () => {
            // 建立一個 Canvas 來擷取當下影片的畫面
            const canvas = document.createElement('canvas');
            canvas.width = cameraPreview.videoWidth;
            canvas.height = cameraPreview.videoHeight;
            const ctx = canvas.getContext('2d');
            
            // 如果是前鏡頭，照片可能需要水平翻轉才符合鏡像直覺 (依需求選用)
            if (currentFacingMode === 'user') {
                ctx.translate(canvas.width, 0);
                ctx.scale(-1, 1);
            }

            // 將 Video 畫面畫到 Canvas 上
            ctx.drawImage(cameraPreview, 0, 0, canvas.width, canvas.height);

            // 將 Canvas 轉換為圖片資料 URL (PNG格式)
            const imageData = canvas.toDataURL('image/png');

            // 建立一個隱藏的 <a> 標籤來觸發下載
            const link = document.createElement('a');
            link.download = `photo_${new Date().getTime()}.png`;
            link.href = imageData;
            link.click();
        });

        // 4. 切換鏡頭功能
        switchBtn.addEventListener('click', () => {
            currentFacingMode = currentFacingMode === 'environment' ? 'user' : 'environment';
            startCamera(); // 重新啟動相機以套用新鏡頭
        });

        // 5. 離開全螢幕
        exitBtn.addEventListener('click', () => {
            if (document.fullscreenElement) {
                document.exitFullscreen();
            }
            // 停止相機
            if (videoStream) {
                videoStream.getTracks().forEach(track => track.stop());
            }
            // 恢復初始畫面
            startOverlay.style.display = 'flex';
            cameraPreview.style.display = 'none';
            controls.style.display = 'none';
        });

        // 監聽按下 ESC 退出全螢幕的事件，同步關閉相機
        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement && startOverlay.style.display === 'none') {
                if (videoStream) {
                    videoStream.getTracks().forEach(track => track.stop());
                }
                startOverlay.style.display = 'flex';
                cameraPreview.style.display = 'none';
                controls.style.display = 'none';
            }
        });
    </script>
</body>
</html>
