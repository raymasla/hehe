<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>全螢幕網頁相機 - 質感升級版</title>
    <style>
        /* 重置基本樣式，隱藏滾動條 */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }

        /* 初始啟動畫面遮罩 */
        #start-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            cursor: pointer;
            z-index: 100;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
            letter-spacing: 1px;
            line-height: 1.5;
        }

        /* 頂部橫線指示器 (仿系統 UI) */
        #top-indicator {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 36px;
            height: 3px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 2px;
            z-index: 10;
            display: none;
        }

        /* 相機預覽影片 (佔據上半部，留出底部控制列空間) */
        #camera-preview {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: calc(100% - 150px);
            object-fit: cover;
            display: none;
            z-index: 1;
        }

        /* 拍照時的閃光效果 */
        #flash {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: white;
            opacity: 0;
            z-index: 50;
            pointer-events: none;
            transition: opacity 0.3s ease-out;
        }
        #flash.active {
            opacity: 1;
            transition: none;
        }

        /* 懸浮在畫面上的控制項 */
        #overlay-controls {
            position: absolute;
            bottom: 165px;
            left: 0;
            width: 100%;
            display: none;
            justify-content: space-between;
            align-items: center;
            padding: 0 25px;
            box-sizing: border-box;
            z-index: 10;
        }

        .side-icon-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: rgba(0, 0, 0, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            backdrop-filter: blur(4px);
        }

        .zoom-slider {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .zoom-slider .dot {
            width: 4px;
            height: 4px;
            background-color: white;
            border-radius: 50%;
            opacity: 0.8;
        }

        .zoom-slider .zoom-level {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.5);
            background-color: rgba(0, 0, 0, 0.4);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 13px;
            font-weight: 500;
            backdrop-filter: blur(4px);
        }

        /* 底部黑色操作面板 */
        #bottom-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 150px;
            background-color: #000;
            display: none;
            flex-direction: column;
            z-index: 10;
        }

        /* 拍攝模式選擇列 */
        .mode-selector {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 22px;
            color: white;
            font-size: 14px;
            padding: 15px 0 10px 0;
            overflow-x: auto;
        }

        .mode-selector span {
            opacity: 0.7;
            cursor: pointer;
            padding-bottom: 6px;
            white-space: nowrap;
        }

        .mode-selector span.active {
            opacity: 1;
            color: #f6c344;
            font-weight: 600;
            position: relative;
        }

        .mode-selector span.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 16px;
            height: 2px;
            background-color: #f6c344;
            border-radius: 1px;
        }

        /* 主要按鈕列 */
        .action-row {
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            flex: 1;
            padding-bottom: 10px;
        }

        /* 左側相簿縮圖 */
        .gallery-thumb {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background-color: #222;
            border: none;
            background-size: cover;
            background-position: center;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .gallery-thumb::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, #444, #222);
            z-index: -1;
        }

        /* 中央拍照快門按鈕 */
        .shutter-btn {
            width: 76px;
            height: 76px;
            border-radius: 50%;
            background-color: transparent;
            border: 4px solid #fff;
            padding: 0;
            position: relative;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.1s;
        }

        .shutter-btn::after {
            content: '';
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background-color: #fff;
            position: absolute;
        }

        .shutter-btn:active {
            transform: scale(0.95);
        }
        .shutter-btn:active::after {
            background-color: #ddd;
        }

        /* 右側切換鏡頭按鈕 */
        .switch-btn {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.15);
            border: none;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .switch-btn:active {
            background-color: rgba(255, 255, 255, 0.3);
        }

        /* --- 驚喜卡片樣式設計 --- */
        #message-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            z-index: 200;
            display: none; /* 預設隱藏 */
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        #message-modal.show {
            display: flex;
            opacity: 1;
        }

        .card {
            background-color: #fff;
            width: 85%;
            max-width: 400px;
            border-radius: 20px;
            padding: 30px 25px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.3);
            text-align: center;
            position: relative;
            animation: popUp 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popUp {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .card h2 {
            margin: 0 0 15px 0;
            color: #333;
            font-size: 22px;
            letter-spacing: 2px;
        }

        .card p {
            color: #555;
            font-size: 15px;
            line-height: 1.8;
            text-align: left;
            margin: 0;
            letter-spacing: 0.5px;
        }

        .close-card-btn {
            margin-top: 25px;
            background-color: #f6c344;
            color: #333;
            border: none;
            padding: 10px 25px;
            border-radius: 20px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .close-card-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div id="start-overlay">
        點擊畫面任意處<br>開啟相機並允許麥克風權限
    </div>

    <div id="top-indicator"></div>

    <video id="camera-preview" autoplay playsinline></video>
    
    <div id="flash"></div>

    <div id="overlay-controls">
        <div class="side-icon-btn" id="lens-btn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M5 8V5h3M19 8V5h-3M5 16v3h3M19 16v3h-3"/>
                <circle cx="12" cy="12" r="3"/>
                <path d="M16 16l-1.5-1.5"/>
            </svg>
        </div>
        <div class="zoom-slider">
            <span class="dot"></span>
            <span class="zoom-level">1X</span>
            <span class="dot"></span>
            <span class="dot"></span>
        </div>
        <div class="side-icon-btn" id="beauty-btn">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="9"/>
                <path d="M9 10h.01M15 10h.01"/>
                <path d="M10 15c.5 1 1.5 1 2 1s1.5 0 2-1"/>
                <path d="M19 4l1-1 1 1-1 1z"/>
            </svg>
        </div>
    </div>

    <div id="bottom-bar">
        <div class="mode-selector">
            <span>夜景</span>
            <span>錄影</span>
            <span class="active">拍照</span>
            <span>人像</span>
            <span>48M</span>
            <span>更多</span>
        </div>
        <div class="action-row">
            <div id="gallery-thumb" class="gallery-thumb"></div>
            <button id="capture-btn" class="shutter-btn"></button>
            <button id="switch-btn" class="switch-btn">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                    <path d="M3 3v5h5"/>
                    <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/>
                    <path d="M16 21v-5h5"/>
                    <circle cx="12" cy="12" r="2.5"/>
                </svg>
            </button>
        </div>
    </div>

    <div id="message-modal">
        <div class="card">
            <h2>dear羽</h2>
            <p>
                雖然我們國一國二還沒講過太多話<br>
                但到了國三 某次奇妙把我的位子排在妳的旁邊<br>
                剛好也有晚修班 我就跟妳聊了起來<br>
                謝謝妳在我難過的時候關心我<br>
                在我有問題的時候教我<br>
                在我無聊的時候跟我玩<br>
                還有常常打電話到很晚🙃<br>
                感謝有妳 讓我的國三變得更愉快<br>
                雖然妳總是有點調皮<br>
                但能在妳旁邊的時光 我過得很開心<br>
                即使畢業之後<br>
                希望可以像直線的光一樣不會終斷我們的connection
            </p>
            <button class="close-card-btn" id="close-modal-btn">知道啦！</button>
        </div>
    </div>

    <script>
        const startOverlay = document.getElementById('start-overlay');
        const cameraPreview = document.getElementById('camera-preview');
        const overlayControls = document.getElementById('overlay-controls');
        const bottomBar = document.getElementById('bottom-bar');
        const topIndicator = document.getElementById('top-indicator');
        const flash = document.getElementById('flash');
        const messageModal = document.getElementById('message-modal');
        const closeModalBtn = document.getElementById('close-modal-btn');
        
        const captureBtn = document.getElementById('capture-btn');
        const switchBtn = document.getElementById('switch-btn');
        const galleryThumb = document.getElementById('gallery-thumb');

        let videoStream = null;
        let currentFacingMode = 'environment'; // 預設使用後置鏡頭

        // 1. 點擊畫面任意處進入全螢幕並啟動相機 (包含麥克風)
        startOverlay.addEventListener('click', async () => {
            try {
                if (!document.fullscreenElement) {
                    await document.documentElement.requestFullscreen();
                }
                
                startOverlay.style.display = 'none';
                topIndicator.style.display = 'block';
                cameraPreview.style.display = 'block';
                overlayControls.style.display = 'flex';
                bottomBar.style.display = 'flex';

                startCamera();
            } catch (err) {
                alert(`無法進入全螢幕或開啟相機: ${err.message}`);
            }
        });

        // 2. 啟動相機與麥克風功能
        async function startCamera() {
            if (videoStream) {
                videoStream.getTracks().forEach(track => track.stop());
            }

            // 在此處將 audio 設為 true，網頁就會詢問麥克風權限
            const constraints = {
                video: {
                    facingMode: currentFacingMode,
                    width: { ideal: 1920 },
                    height: { ideal: 1080 }
                },
                audio: true 
            };

            try {
                videoStream = await navigator.mediaDevices.getUserMedia(constraints);
                cameraPreview.srcObject = videoStream;
            } catch (err) {
                console.error("相機或麥克風存取失敗:", err);
                alert("無法存取相機或麥克風，請確認您已給予瀏覽器權限。");
            }
        }

        // 3. 拍照功能改為：閃光燈 -> 擷取畫面當縮圖 -> 彈出告白卡片
        captureBtn.addEventListener('click', () => {
            if (!videoStream) return;

            // 觸發閃光燈效果
            flash.classList.add('active');
            setTimeout(() => {
                flash.classList.remove('active');
            }, 60);

            // 偷偷擷取一張畫面放到左下角縮圖，讓操作看起來很逼真
            const canvas = document.createElement('canvas');
            canvas.width = cameraPreview.videoWidth;
            canvas.height = cameraPreview.videoHeight;
            const ctx = canvas.getContext('2d');
            
            if (currentFacingMode === 'user') {
                ctx.translate(canvas.width, 0);
                ctx.scale(-1, 1);
            }
            ctx.drawImage(cameraPreview, 0, 0, canvas.width, canvas.height);
            const imageData = canvas.toDataURL('image/png');
            galleryThumb.style.backgroundImage = `url(${imageData})`;

            // 延遲一點點時間彈出卡片（讓閃光燈效果先跑完）
            setTimeout(() => {
                messageModal.classList.add('show');
            }, 300);
        });

        // 關閉卡片按鈕
        closeModalBtn.addEventListener('click', () => {
            messageModal.classList.remove('show');
            // 等待過渡動畫結束後隱藏
            setTimeout(() => {
                messageModal.style.display = 'none';
                messageModal.style.display = ''; // 恢復 CSS 控制
            }, 500);
        });

        // 4. 切換鏡頭功能
        switchBtn.addEventListener('click', () => {
            currentFacingMode = currentFacingMode === 'environment' ? 'user' : 'environment';
            startCamera(); 
        });

        // 5. 監聽退出全螢幕事件
        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement && startOverlay.style.display === 'none') {
                if (videoStream) {
                    videoStream.getTracks().forEach(track => track.stop());
                }
                startOverlay.style.display = 'flex';
                topIndicator.style.display = 'none';
                cameraPreview.style.display = 'none';
                overlayControls.style.display = 'none';
                bottomBar.style.display = 'none';
                messageModal.classList.remove('show');
            }
        });
    </script>
</body>
</html>
